<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76" role="img" aria-label="FORESIGHT Nexus">
  <defs>
    <linearGradient id="logo_text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8FF"/>
      <stop offset="100%" stop-color="#8A63FF"/>
    </linearGradient>
    <linearGradient id="icon_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5EFF"/>
      <stop offset="50%" stop-color="#28B8FF"/>
      <stop offset="100%" stop-color="#8A63FF"/>
    </linearGradient>
  </defs>

  <!-- Left: Hexagonal Nexus Icon -->
  <g transform="translate(6, 6)">
    <polygon points="32,2 58,18 58,48 32,64 6,48 6,18" 
             fill="#090D18" stroke="url(#icon_grad)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="32,2 32,33 6,48 6,18" fill="#13233F" opacity="0.9" stroke="rgba(40,184,255,0.2)" stroke-width="1"/>
    <polygon points="32,2 58,18 58,48 32,33" fill="#1A2238" opacity="0.9" stroke="rgba(138,99,255,0.2)" stroke-width="1"/>
    <polygon points="6,48 32,33 58,48 32,64" fill="#060912" stroke="rgba(40,184,255,0.15)" stroke-width="1"/>
    
    <path d="M14 43 L14 26 L32 38 L50 20" 
          fill="none" stroke="url(#icon_grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 16 L52 16 L52 26" 
          fill="none" stroke="#8A63FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="33" r="3" fill="#28B8FF"/>
  </g>

  <!-- Right: Structured Typography Hierarchy -->
  <g transform="translate(84, 0)">
    <text x="0" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" font-weight="800" letter-spacing="2" fill="#F1F5F9">FORESIGHT</text>
    <text x="162" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" font-weight="800" letter-spacing="2.5" fill="url(#logo_text_grad)">NEXUS</text>
    
    <text x="1" y="58" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" font-weight="600" letter-spacing="1.8" fill="#7E8DA4">AI DEMAND &amp; INVENTORY INTELLIGENCE</text>
  </g>
</svg>